name: テニスコート空き照会

on:
  schedule:
    # 日本時間 6:30 / 11:30 / 13:30 / 17:30 / 21:30 に実行
    # （UTCはJSTの9時間前のため、それぞれ 21:30(前日) / 2:30 / 4:30 / 8:30 / 12:30 UTC）
    # 2026-09-16: schedule再同期のためコミット
    - cron: "30 21,2,4,8,12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: court-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 依存パッケージをインストール
        run: npm ci

      - name: Playwright（Chromium）をインストール
        run: npx playwright install --with-deps chromium

      - name: 空き状況を照会してHTMLを生成
        run: node src/index.js

      - name: 変更があればコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "空き状況を更新"
            git push
          fi
