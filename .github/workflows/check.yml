name: テニスコート空き照会

on:
  schedule:
    # 日本時間 5:30 / 7:30 / 9:30 / 11:30 / 13:30 / 15:30 / 17:30 / 19:30 / 21:30 / 23:30 に実行
    # （UTCはJSTの9時間前のため、それぞれ 20:30(前日) / 22:30(前日) / 0:30 / 2:30 / 4:30 / 6:30 / 8:30 / 10:30 / 12:30 / 14:30 UTC）
    # 2026-09-17: cron変更直後に15:30/17:30(JST)の発火が飛んだため、再pushしてschedule登録を再同期
    - cron: "30 0,2,4,6,8,10,12,14,20,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: court-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 依存パッケージをインストール
        run: npm ci

      - name: Playwright（Chromium）をインストール
        run: npx playwright install --with-deps chromium

      - name: 空き状況を照会してHTMLを生成
        run: node src/index.js

      - name: 変更があればコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html data/previous.json
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "空き状況を更新"
            git push
          fi
